[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gjallar-client"
version = "0.1.0"
description = "Gjallar API client and guided local bootstrap"
requires-python = ">=3.13"
dependencies = ["httpx==0.27.2", "keyring==25.7.0"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
gjallar = "gjallar_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gjallar_client = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
